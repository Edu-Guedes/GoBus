{# Cabeçalho. Variáveis: titulo, kicker (opcional), voltar (nome da URL, opcional), centralizar (opcional), passageiro #}
<header class="header{% if centralizar %} centro{% endif %}">
  {% if voltar %}
    <a class="circle" href="{% url voltar passageiro.id %}" aria-label="Voltar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </a>
  {% endif %}

  <h1>
    {% if kicker %}<small>{{ kicker }}</small>{% endif %}
    {{ titulo }}
  </h1>

  {% include "fragments/sino.html" %}
</header>
