{% extends "base.html" %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'passageiros/css/passageiros.css' %}">{% endblock %}

{% block content %}
  <section class="mapa">
    <iframe src="{{ mapa_url }}" title="Mapa da rota do ônibus" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    <div class="mapa-chip">Próxima parada em<b>{{ rota.proxima_parada }}</b></div>
  </section>

  <section class="card">
    <div class="row"><span>Linha</span><b>{{ rota.linha }}</b></div>
    <div class="row"><span>Motorista</span><b>{{ rota.motorista }}</b></div>
    <div class="row"><span>Velocidade</span><b>{{ rota.velocidade }}</b></div>
  </section>

  <a class="btn outline" href="{{ mapa_externo }}" target="_blank" rel="noopener">Abrir no Google Maps</a>
{% endblock %}
